name: radietto
description: "Radietto - LLM-powered radio app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio playback
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3

  # YouTube
  youtube_explode_dart: ^3.0.5

  # HTTP / API
  http: ^1.2.2

  # Configuration
  flutter_dotenv: ^5.2.1

  # Persistence
  shared_preferences: ^2.3.4

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/station_tiles/

flutter_launcher_icons:
  image_path: "assets/icon/radietto_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/radietto_icon.png"
  web:
    generate: true
    image_path: "assets/icon/radietto_icon.png"
    background_color: "#53B1F8"
    theme_color: "#0006BA"
